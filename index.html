<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cats at Sunset · Vivienne Le</title>
  <meta name="description" content="Two cats watching the sun set and the moon rise. A Processing sketch by Vivienne Le, ported to p5.js.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23ffcc66'/%3E%3Cellipse cx='16' cy='20' rx='6' ry='8' fill='%23000'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: 'Monsieur La Doulaise';
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/monsieur-la-doulaise@5.3.0/files/monsieur-la-doulaise-latin-400-normal.woff2') format('woff2');
      font-display: swap;
    }
    @font-face {
      font-family: 'Moirai One';
      src: url('https://cdn.jsdelivr.net/npm/@fontsource/moirai-one@5.3.0/files/moirai-one-latin-400-normal.woff2') format('woff2');
      font-display: swap;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      box-sizing: border-box;
      background: #14102a;
      color: #f1ecff;
      font: 24px/1.4 'Moirai One', system-ui, sans-serif;
      text-align: center;
    }

    main {
      width: min(600px, 100%);
      display: grid;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font: 400 4rem/1.1 'Monsieur La Doulaise', cursive;
    }

    p {
      margin: 0;
    }

    #stage {
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    /* p5 sets a fixed size on the canvas, this lets it scale with the page */
    #stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      cursor: pointer;
    }

    button {
      justify-self: center;
      padding: 8px 20px;
      font: inherit;
      color: inherit;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    small {
      font-size: 19px;
      color: #d6cdf2;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cats at Sunset</h1>
    <p>Click a cat to give it a heart.</p>
    <div id="stage" role="img" aria-label="Two black cats sit on a beach while the sun sets and the moon rises"></div>
    <button type="button" onclick="restart()">Watch it again</button>
    <small>Made in Processing by <a href="https://www.linkedin.com/in/le-vivienne">Vivienne Le</a></small>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
